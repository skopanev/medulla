[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medulla"
version = "4.39.5"
description = "medulla — a state machine for AI agents (nodes, signals, pools)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.scripts]
medulla = "medulla.cli:entry"

[tool.setuptools]
packages = [
  "medulla",
  "medulla.scripts",
  "medulla.scripts.dockerlib",
  "medulla.v2",
  "medulla.v2.harnesses",
  "medulla.workflows",
  "medulla.workflows.spar",
  "medulla.workflows.spar.prompts",
  "medulla.workflows.spar.scripts",
]

[tool.setuptools.package-dir]
"medulla" = "cli-agent/medulla"
"medulla.scripts" = "cli-agent/scripts"
"medulla.scripts.dockerlib" = "cli-agent/scripts/dockerlib"
"medulla.workflows" = "cli-agent/workflows"

[tool.setuptools.package-data]
"medulla.scripts" = ["*.py", "*.sh", "Dockerfile.default"]
"medulla.scripts.dockerlib" = ["*.py"]
"medulla.workflows" = ["**/*"]

# One rule, deliberately: file length. ruff has no equivalent (pylint's C0302 is not
# among the pylint rules it reimplements), and a second linter earns its keep only if
# it is not a second opinion on everything else — so everything else is off.
[tool.pylint.main]
disable = ["all"]
enable = ["too-many-lines"]

[tool.pylint.format]
max-module-lines = 250   # source AND tests: a 600-line test file hides its duplicates too

[dependency-groups]
# Never shipped: `pipx install medulla` reads [project.dependencies] and nothing here.
dev = ["pytest", "ruff", "pylint"]
