# spar — a panel of independent models answers the same question in parallel.
#
# Run (the question travels as a FILE — a shell argument loses quoting, hits
# MAX_ARG_STRLEN, and turns a variable that lost its content into an empty question):
#   medulla launch spar start question.md   <- the supported way; it composes the below
#   medulla -w spar --var-file "QUESTION=question.md"
#   medulla --docker --cwd-ro --runs-folder .medulla/panel-runs \
#     -w spar --var-file "QUESTION=question.md"
#
# Output: synthesized.md inside $MEDULLA_RUN_DIR/artifacts/.
#
# v2 shape: the panel is a pool over agent-typed inputs — every scalar agent
# field is a template, so one body serves all panelists (no dispatcher script:
# panelist.sh died with v1). post: is the truth channel — a panelist counts
# only if its output file exists, regardless of its CLI's exit code.
# min_success: 3 of 5 — the general contract calls a panel's answer by MAJORITY, so
# a round that only one model survived is not a quorum and must not exit 0. It used to
# be 1 ("useful if anyone delivered"), which left the agent to notice the shortfall on
# its own; the engine says it now. synthesize still stamps a warning on partial
# delivery, for the 3 and 4 cases. Interrupted/timed-out runs resume with
# --resume: delivered panelists are skipped via the manifest done-mask.
version: "2"
start: prepare

timeout: 3600


defaults:
  timeout: 1800

nodes:

  prepare:
    shell: |
      if [ -z "${QUESTION:-}" ]; then
        echo "<signal:failed>provide a question via --var-file QUESTION=path</signal:failed>"
        exit 1
      fi
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      printf '%s\n' "$QUESTION" > "$MEDULLA_RUN_DIR/artifacts/question.md"
      echo "<signal:var key=ROUND_DIR>$MEDULLA_RUN_DIR/artifacts</signal:var>"
      echo "<signal:ready>ok</signal:ready>"
    timeout: 30
    on_signal:
      ready: panel
      failed: __exit_fail__

  panel:
    inputs:
      - {slug: glm5,   harness: opencode,    model: zai-coding-plan/glm-5.3, effort: max}
      - {slug: gpt5,   harness: codex,       model: gpt-5.6-sol,             effort: high}
      - {slug: sonnet, harness: claude-code, model: claude-sonnet-5}
      - {slug: gemini, harness: agy,         model: "Gemini 3.1 Pro (High)"}
      - {slug: qwen,   harness: opencode,    model: alibaba-token-plan/qwen3.8-max, effort: xhigh}
    max_parallel: all
    min_success: 3        # majority of the 5-model roster
    pre: |
      # A dead provider must not cost the panel half an hour of silence: opencode
      # swallows a 429 and hangs until the step timeout, so ask the API directly —
      # a quota refusal comes back in under a second. rc!=0 in pre is a SOFT fail
      # (signal __failed__, attempts=0): this panelist sits the round out and the
      # others still deliver, which is what min_success/quorum are for.
      # Only opencode has a cheap, honest signal; every other harness passes through.
      # MEDULLA_INPUT_HARNESS first: in a pool MEDULLA_HARNESS still holds the
      # unrendered "{{input.harness}}" (engine builds the tag before rendering).
      harness="${MEDULLA_INPUT_HARNESS:-${MEDULLA_HARNESS:-}}"
      [ "$harness" = "opencode" ] || exit 0
      model="${MEDULLA_INPUT_MODEL:-}"
      case "$model" in */*) ;; *) exit 0 ;; esac
      provider="${model%%/*}"; model_id="${model#*/}"
      auth="$HOME/.local/share/opencode/auth.json"
      [ -r "$auth" ] || exit 0
      key=$(jq -r --arg p "$provider" '.[$p].key // empty' "$auth" 2>/dev/null)
      [ -n "$key" ] || exit 0
      # base url: local models cache when present (host), else models.dev (container
      # has no cache). Cannot resolve it -> skip the check rather than invent a verdict.
      api=$(jq -r --arg p "$provider" '.[$p].api // empty' \
            "$HOME/.cache/opencode/models.json" 2>/dev/null)
      [ -n "$api" ] || api=$(curl -sS -m 15 https://models.dev/api.json 2>/dev/null \
            | jq -r --arg p "$provider" '.[$p].api // empty')
      [ -n "$api" ] || exit 0
      body=$(jq -nc --arg m "$model_id" \
             '{model:$m,messages:[{role:"user",content:"ping"}],max_tokens:1}')
      out=$(mktemp)
      code=$(curl -sS -m 20 -o "$out" -w '%{http_code}' \
             -H 'Content-Type: application/json' -H "Authorization: Bearer $key" \
             -d "$body" "${api%/}/chat/completions" 2>/dev/null)
      if [ "$code" = 200 ]; then rm -f "$out"; exit 0; fi
      why=$(jq -r '.error.message // empty' "$out" 2>/dev/null); rm -f "$out"
      echo "${MEDULLA_INPUT_SLUG:-panelist} sits this round out: $provider answered HTTP $code${why:+ - $why}" >&2
      exit 1
    agent:
      harness: "{{input.harness}}"
      model: "{{input.model}}"
      effort: "{{input.effort:-}}"
    prompt: |
      {{file:prompts/spar.md}}

      ## Question

      {{var:QUESTION}}

      FIRST, use your file-write tool to write your FULL response to this exact
      path. This file IS your deliverable — printing a SUMMARY without writing
      the file counts as NO answer, however trivial the task seems:

      ```
      {{var:ROUND_DIR}}/{{input.slug}}.md
      ```

      Only AFTER the file exists on disk, print exactly one line and stop:

      SUMMARY: <your one-sentence summary>
    post: 'test -s "$ROUND_DIR/$MEDULLA_INPUT_SLUG.md"'
    max_attempts: 2                       # a panelist that skips the file-write retries once
    timeout: 1800
    on_signal:
      __done__: synthesize
      __failed__: __exit_fail__

  synthesize:
    shell: |
      # No model runs here — jq and awk, in the workflow itself, so there is no tool to
      # mount and none to lose. What it answers that the per-panelist files cannot: WHO
      # delivered (a dead panelist leaves no file), what the verdicts were TOGETHER, and
      # WHICH findings a NO-GO actually rests on.
      rows=$(jq -s 'group_by(.key) | map(.[-1])' "$MEDULLA_MANIFEST_PANEL")   # resume appends: latest row per input wins
      total=$(echo "$rows" | jq length)
      ok=$(echo "$rows" | jq 'map(select(.ok)) | length')
      out="$MEDULLA_RUN_DIR/verdict.md"
      body="$MEDULLA_RUN_DIR/.body"; raw="$MEDULLA_RUN_DIR/.raw"; map="$MEDULLA_RUN_DIR/.map"
      : > "$body"; : > "$raw"; : > "$map"

      panelists() {
        for f in "$ROUND_DIR"/*.md; do
          [ -e "$f" ] || continue
          case "$(basename "$f")" in question.md|verdict.md|synthesized.md) continue ;; esac
          printf '%s\n' "$f"
        done
      }

      # FINDINGS first, because the verdicts below cite them by number. Each line keeps
      # its severity key and its position in ITS OWN panelist's list, which is what a
      # panelist can see when writing "NO-GO — 1, 3".
      findings=0; quiet=""
      for f in $(panelists); do
        slug=$(basename "$f" .md)
        n=$(awk '/^## FINDINGS/{flag=1; next} /^## /{flag=0} flag && /^[-*]/' "$f" | wc -l | tr -d ' ')
        if [ "$n" -eq 0 ]; then quiet="$quiet${quiet:+, }$slug"; continue; fi
        findings=$((findings + n))
        awk -v who="$slug" '/^## FINDINGS/{flag=1; next} /^## /{flag=0}
             flag && /^[-*]/ {
               sub(/^[-*][ \t]*/, ""); local++
               key = 4
               if ($0 ~ /HIGH/)     key = 1
               else if ($0 ~ /MED/) key = 2
               else if ($0 ~ /LOW/) key = 3
               printf "%d\t%s\t%d\t%s\n", key, who, local, $0
             }' "$f" >> "$raw"
      done
      {
        printf '## Findings\n\n'
        # -s keeps each panelist's own order inside a severity band. The map lets a
        # verdict that says "1, 3" be printed as the F-numbers a reader can find.
        sort -s -k1,1n "$raw" | awk -F'\t' -v map="$map" \
          '{ printf "F%d. %s — %s\n", NR, $2, $4; printf "%s %s %d\n", $2, $3, NR >> map }'
        [ -n "$quiet" ] && printf '\nNo findings reported by: %s\n' "$quiet"
        printf '\n'
      } >> "$body"

      go=0; nogo=0; insuf=0; nover=0; blocking=""; unsupported=""
      {
        printf '## Verdicts\n\n'
        for f in $(panelists); do
          slug=$(basename "$f" .md)
          word=$(awk '/^## VERDICT/{flag=1; next} /^## /{flag=0} flag && NF {print; exit}' "$f")
          case "$word" in
            GO*)           go=$((go + 1)) ;;
            NO-GO*)        nogo=$((nogo + 1)) ;;
            INSUFFICIENT*) insuf=$((insuf + 1)) ;;
            *)             nover=$((nover + 1)); word="_no VERDICT section_" ;;
          esac
          if [ "${word#NO-GO}" != "$word" ]; then
            # Translate "NO-GO — 1, 3 — reason" into the ids the reader sees. A NO-GO
            # citing nothing is named as unsupported rather than silently counted: it
            # cannot be checked, acted on, or cleared.
            cited=$(printf '%s' "$word" | sed -n 's/^NO-GO[^0-9]*\([0-9, ]*\).*/\1/p' | tr -d ' ')
            ids=""
            for c in $(printf '%s' "$cited" | tr ',' ' '); do
              g=$(awk -v s="$slug" -v l="$c" '$1==s && $2==l {print $3}' "$map")
              [ -n "$g" ] && ids="$ids${ids:+, }F$g"
            done
            if [ -n "$ids" ]; then
              blocking="$blocking${blocking:+, }$ids"
              # drop the panelist's own numbering once translated: "NO-GO — 1 — reason"
              # reads as a stray digit beside the ids the reader can actually act on
              word=$(printf '%s' "$word" | sed "s/^NO-GO[^—]*—[ ]*[0-9, ]*—*[ ]*/NO-GO ($ids) — /")
            else
              unsupported="$unsupported${unsupported:+, }$slug"
              word="$word  _(cites no finding — an opinion, not a block)_"
            fi
          fi
          printf -- '- **%s** — %s\n' "$slug" "$word"
        done
        printf '\n'
      } >> "$body"

      {
        printf '# Panel verdict — GO %s · NO-GO %s · INSUFFICIENT %s' "$go" "$nogo" "$insuf"
        [ "$nover" -gt 0 ] && printf ' · no verdict %s' "$nover"
        printf '\n\n%s findings from %s panelist(s).\n\n' "$findings" "$((go + nogo + insuf + nover))"
        # The line the reader acts on. NOT a tally: two GO against two NO-GO is not a
        # draw to be broken by counting — it is a list of findings to judge. A landing
        # went through on exactly that arithmetic.
        if [ -n "$blocking" ]; then
          printf 'BLOCKING: %s — judge each against its cited code before landing.\n' "$blocking"
          printf 'Clear one only by writing down what refutes it; unjudged means blocked.\n\n'
        else
          printf 'BLOCKING: none cited.\n\n'
        fi
        [ -n "$unsupported" ] && printf 'Unsupported NO-GO (cites no finding): %s\n\n' "$unsupported"
        if [ "$ok" -lt "$total" ]; then
          printf '> **WARNING:** only %s of %s panelists delivered. This is a partial\n' "$ok" "$total"
          printf '> panel — do not report it as a full one.\n\n'
        fi
        printf '%s\n' \
          'HOW TO READ THIS (rules, not suggestions):' \
          '' \
          '- The verdicts are NOT a vote. GO 2 · NO-GO 2 is not a draw to break by' \
          '  counting — it is a list of findings to judge. Work the BLOCKING line.' \
          '- Carry EVERY finding forward by its id. A finding one panelist made is not' \
          '  weak — it is the one nobody else saw. Merge two only if they are literally' \
          '  the same claim, never because they feel similar.' \
          '- Do NOT re-summarise this file. It is already the compression; the prose it' \
          '  came from is in the per-panelist files beside it.' \
          '- (R) means the panelist verified it — opened the file, ran the command.' \
          '  (G) is a guess. Check a (G) before acting on it; do not discard it.' \
          '- FIX: is the panelist'"'"'s proposed remedy, not an instruction. Judge it.' \
          '- INSUFFICIENT means that panelist could not see enough — read what it says' \
          '  it was missing, and decide whether the round covered the change at all.' \
          ''
        cat "$body"
      } > "$out"
      rm -f "$body" "$raw" "$map"

      [ "$ok" -lt "$total" ] && echo "<signal:update>only $ok/$total panelists delivered</signal:update>"
      [ -n "$blocking" ] && echo "<signal:update>BLOCKING: $blocking</signal:update>"

      if [ ! -s "$out" ]; then
        echo "verdict.md was not written; the panelists' own files are in $ROUND_DIR:"
        ls "$ROUND_DIR"/*.md 2>/dev/null || true
        echo "<signal:no_verdict>no $out — read $ROUND_DIR/*.md</signal:no_verdict>"
      else
        echo "$ok/$total panelists, $findings finding(s) -> $out"
        echo "<signal:ready>$out</signal:ready>"
      fi
    timeout: 30
    on_signal:
      ready: __exit_ok__
      # A panel that answered but could not be collected is NOT a failed panel: the
      # artifacts are there and worth reading. It exits ok with the reason on record.
      no_verdict: __exit_ok__
