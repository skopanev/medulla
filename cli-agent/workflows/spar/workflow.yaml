# spar — a panel of independent models answers the same question in parallel.
#
# Run:
#   medulla -w .medulla/workflows/spar --var "QUESTION=your question"
#   medulla --docker -w .medulla/workflows/spar --var "QUESTION=..."
#
# Output: synthesized.md inside $MEDULLA_RUN_DIR/artifacts/.
#
# v2 shape: the panel is a pool over agent-typed inputs — every scalar agent
# field is a template, so one body serves all panelists (no dispatcher script:
# panelist.sh died with v1). post: is the truth channel — a panelist counts
# only if its output file exists, regardless of its CLI's exit code.
# min_success: 1 = the panel is useful if anyone delivered; synthesize stamps
# a warning on partial delivery. Interrupted/timed-out runs resume with
# --resume: delivered panelists are skipped via the manifest done-mask.
version: "2"
start: prepare

# Run codex through the broker wrapper when the machine has one; plain codex
# otherwise. The wrapper picks a live account, so a panel never stalls on an
# exhausted one.
harness_bin:
  codex: cx
timeout: 3600


defaults:
  timeout: 1800

nodes:

  prepare:
    shell: |
      if [ -z "${QUESTION:-}" ]; then
        echo "<signal:failed>provide a question via --var QUESTION=\"...\"</signal:failed>"
        exit 1
      fi
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      printf '%s\n' "$QUESTION" > "$MEDULLA_RUN_DIR/artifacts/question.md"
      echo "<signal:var key=ROUND_DIR>$MEDULLA_RUN_DIR/artifacts</signal:var>"
      echo "<signal:ready>ok</signal:ready>"
    timeout: 30
    on_signal:
      ready: panel
      failed: __exit_fail__

  panel:
    inputs:
      - {slug: glm5,   harness: opencode,    model: zai-coding-plan/glm-5.3, effort: max}
      - {slug: gpt5,   harness: codex,       model: gpt-5.6-sol,             effort: high}
      - {slug: sonnet, harness: claude-code, model: claude-sonnet-5}
      - {slug: gemini, harness: agy,         model: "Gemini 3.1 Pro (High)"}
      - {slug: qwen,   harness: opencode,    model: alibaba-token-plan/qwen3.8-max, effort: xhigh}
    max_parallel: all
    min_success: 1
    pre: |
      # A dead provider must not cost the panel half an hour of silence: opencode
      # swallows a 429 and hangs until the step timeout, so ask the API directly —
      # a quota refusal comes back in under a second. rc!=0 in pre is a SOFT fail
      # (signal __failed__, attempts=0): this panelist sits the round out and the
      # others still deliver, which is what min_success/quorum are for.
      # Only opencode has a cheap, honest signal; every other harness passes through.
      # MEDULLA_INPUT_HARNESS first: in a pool MEDULLA_HARNESS still holds the
      # unrendered "{{input.harness}}" (engine builds the tag before rendering).
      harness="${MEDULLA_INPUT_HARNESS:-${MEDULLA_HARNESS:-}}"
      [ "$harness" = "opencode" ] || exit 0
      model="${MEDULLA_INPUT_MODEL:-}"
      case "$model" in */*) ;; *) exit 0 ;; esac
      provider="${model%%/*}"; model_id="${model#*/}"
      auth="$HOME/.local/share/opencode/auth.json"
      [ -r "$auth" ] || exit 0
      key=$(jq -r --arg p "$provider" '.[$p].key // empty' "$auth" 2>/dev/null)
      [ -n "$key" ] || exit 0
      # base url: local models cache when present (host), else models.dev (container
      # has no cache). Cannot resolve it -> skip the check rather than invent a verdict.
      api=$(jq -r --arg p "$provider" '.[$p].api // empty' \
            "$HOME/.cache/opencode/models.json" 2>/dev/null)
      [ -n "$api" ] || api=$(curl -sS -m 15 https://models.dev/api.json 2>/dev/null \
            | jq -r --arg p "$provider" '.[$p].api // empty')
      [ -n "$api" ] || exit 0
      body=$(jq -nc --arg m "$model_id" \
             '{model:$m,messages:[{role:"user",content:"ping"}],max_tokens:1}')
      out=$(mktemp)
      code=$(curl -sS -m 20 -o "$out" -w '%{http_code}' \
             -H 'Content-Type: application/json' -H "Authorization: Bearer $key" \
             -d "$body" "${api%/}/chat/completions" 2>/dev/null)
      if [ "$code" = 200 ]; then rm -f "$out"; exit 0; fi
      why=$(jq -r '.error.message // empty' "$out" 2>/dev/null); rm -f "$out"
      echo "${MEDULLA_INPUT_SLUG:-panelist} sits this round out: $provider answered HTTP $code${why:+ - $why}" >&2
      exit 1
    agent:
      harness: "{{input.harness}}"
      model: "{{input.model}}"
      effort: "{{input.effort:-}}"
    prompt: |
      {{file:prompts/spar.md}}

      ## Question

      {{var:QUESTION}}

      FIRST, use your file-write tool to write your FULL response to this exact
      path. This file IS your deliverable — printing a SUMMARY without writing
      the file counts as NO answer, however trivial the task seems:

      ```
      {{var:ROUND_DIR}}/{{input.slug}}.md
      ```

      Only AFTER the file exists on disk, print exactly one line and stop:

      SUMMARY: <your one-sentence summary>
    post: 'test -s "$ROUND_DIR/$MEDULLA_INPUT_SLUG.md"'
    max_attempts: 2                       # a panelist that skips the file-write retries once
    timeout: 1800
    on_signal:
      __done__: synthesize
      __failed__: __exit_fail__

  synthesize:
    shell: |
      out="$ROUND_DIR/synthesized.md"
      rows=$(jq -s 'group_by(.key) | map(.[-1])' "$MEDULLA_MANIFEST_PANEL")   # resume appends: latest row per input wins
      total=$(echo "$rows" | jq length)
      ok=$(echo "$rows" | jq 'map(select(.ok)) | length')
      : > "$out"
      {
        echo "<!-- Full text of every panelist that delivered. This is a UNION, not a"
        echo "     consensus: carry each distinct finding forward. A point raised by one"
        echo "     panelist is not a weak point — it is the one nobody else saw. Per-panelist"
        echo "     files live beside this one as <slug>.md; read those too. -->"
        echo
      } >> "$out"
      for slug in $(echo "$rows" | jq -r 'map(select(.ok) | .input.slug) | .[]'); do
        f="$ROUND_DIR/$slug.md"
        [ -f "$f" ] || continue
        { echo "# $slug"; echo; cat "$f"; echo; echo "---"; echo; } >> "$out"
      done
      if [ "$ok" -lt "$total" ]; then
        printf '> WARNING: only %s/%s panelists delivered output\n' "$ok" "$total" >> "$out"
        echo "<signal:update>only $ok/$total panelists delivered</signal:update>"
      fi
      echo "synthesized $ok takes -> $out"
      echo "<signal:ready>$out</signal:ready>"
    timeout: 30
    on_signal:
      ready: __exit_ok__
