# spar — a panel of independent models answers the same question in parallel.
#
# Run (the question travels as a FILE — a shell argument loses quoting, hits
# MAX_ARG_STRLEN, and turns a variable that lost its content into an empty question):
#   medulla launch spar start question.md   <- the supported way; it composes the below
#   medulla -w spar --var-file "QUESTION=question.md"
#   medulla --docker --cwd-ro --runs-folder .medulla/panel-runs \
#     -w spar --var-file "QUESTION=question.md"
#
# Output: verdict.md + verdict.json in $MEDULLA_RUN_DIR (NOT artifacts/synthesized.md).
#
# v2 shape: the panel is a pool over agent-typed inputs — every scalar agent
# field is a template, so one body serves all panelists (no dispatcher script:
# panelist.sh died with v1). post: is the truth channel — a panelist counts
# only if its output file exists, regardless of its CLI's exit code.
# min_success: 3 of 4 — the general contract calls a panel's answer by MAJORITY, so
# a round that only one model survived is not a quorum and must not exit 0. It used to
# be 1 ("useful if anyone delivered"), which left the agent to notice the shortfall on
# its own; the engine says it now. synthesize still stamps a warning on partial
# delivery, for the 3 and 4 cases. Interrupted/timed-out runs resume with
# --resume: delivered panelists are skipped via the manifest done-mask.
version: "2"
start: prepare

vars:
  # GO/NO-GO verdicts needed for the round to have HAPPENED. Delivery is not the same
  # as an opinion: a panelist whose workspace was empty delivers an honest INSUFFICIENT,
  # and a file full of those is not an answer to anything.
  MIN_DECIDED: "3"

  # What the caller knows about the thing under review. All optional: pass what you
  # have (--var TICKET=... --var HEAD=...), and only what is passed appears in
  # verdict.json. An empty field would read as an answer.
  TICKET: ""
  PURPOSE: ""
  BASE: ""
  HEAD: ""
  PATCH_DIGEST: ""

  # Filled by prepare from the tree itself, not by the caller — see the comment
  # there. These are what the round REVIEWED, as opposed to what it was told.
  REVIEWED_HEAD: ""
  REVIEWED_STATE: ""
  REVIEWED_DIGEST: ""
  REVIEWED_DIGEST_SCOPE: ""   # full | names-only — WHAT the digest covers

timeout: 3600


defaults:
  timeout: 1800

nodes:

  prepare:
    shell: |
      if [ -z "${QUESTION:-}" ]; then
        echo "<signal:failed>provide a question via --var-file QUESTION=path</signal:failed>"
        exit 1
      fi
      # The panel reviews a TREE. An empty /workspace means the mounts did not land —
      # and the round that follows is the whole panel reasoning about nothing, which reads
      # like an answer and is not one. Live: a --mount failed, the retry ran without
      # it, three of four panelists reported INSUFFICIENT, and a verdict.md was still
      # produced. Fail here, before spending twenty minutes on it.
      # The tree under review is the working directory. In a container that IS
      # /workspace; natively it is wherever the caller ran from. Hardcoding the
      # container path made the panel unrunnable without docker — which is the only
      # thing that kept it down when the container runtime failed.
      visible=$(ls -A . 2>/dev/null | grep -vcE '^(\.medulla|\.git|box)$' || true)
      if [ "${visible:-0}" -eq 0 ]; then
        echo "workspace is empty — nothing to review (mounts did not land?)" >&2
        pwd >&2; ls -A . 2>&1 | head -5 >&2
        echo "<signal:failed>empty workspace: the panel would review nothing</signal:failed>"
        exit 1
      fi

      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      printf '%s\n' "$QUESTION" > "$MEDULLA_RUN_DIR/artifacts/question.md"
      echo "<signal:var key=ROUND_DIR>$MEDULLA_RUN_DIR/artifacts</signal:var>"

      # WHAT WAS ACTUALLY REVIEWED. A verdict costing an hour and four models used
      # to carry no record of the thing it looked at, so a day later nobody could
      # say whether it applied to the current tree or to a state three days gone.
      # HEAD alone does not answer that: the panel reads the WORKING TREE, and a
      # dirty or untracked file is part of what it reviewed while being absent from
      # any commit. So the digest covers HEAD, the staged and unstaged diff, and the
      # content of untracked files — the bytes the panelists could actually open.
      # Nothing here is invented: a tree that is not a git repository says so, and
      # the non-code question mode (a strategy call with no diff at all) keeps
      # working exactly as before, with the fields simply absent.
      if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        head=$(git rev-parse HEAD 2>/dev/null || echo "no-commits")
        dirty=$(git status --porcelain --untracked-files=all 2>/dev/null | head -c 1)
        # COUNT BEFORE READING. The untracked term reads the CONTENT of every file
        # git does not track — the right definition, since those bytes are exactly what
        # a panelist can open and no commit records them. It is also a trap wherever
        # .gitignore does not apply: a handout tree, a fresh clone, a broken .git. Same
        # repository, same command: 3 files with the ignore rules in force, 170378
        # without. Hashing those did not finish in FIVE MINUTES against a 30s node
        # budget. Nine rounds died on it, and they died as rc=124 "body died" — which
        # reads as a panelist refusing, when the round had not begun at all.
        #
        # Over the limit the digest covers NAMES only, and says so. A partial
        # fingerprint passed off as a whole one is worse than none: it compares equal
        # to nothing and unequal to everything, and the reader cannot tell why.
        untracked_n=$(git ls-files --others --exclude-standard 2>/dev/null | wc -l | tr -d ' ')
        if [ "${untracked_n:-0}" -le 2000 ]; then
          scope=full
          content=$( { printf 'head:%s\n' "$head"
                       git status --porcelain --untracked-files=all 2>/dev/null
                       git diff HEAD 2>/dev/null
                       git ls-files --others --exclude-standard -z 2>/dev/null \
                         | xargs -0 -I{} sh -c 'printf "untracked:%s\n" "{}"; cat "{}" 2>/dev/null' \
                       ; } | shasum -a 256 2>/dev/null | cut -d' ' -f1 )
        else
          scope=names-only
          content=$( { printf 'head:%s\n' "$head"
                       git diff HEAD 2>/dev/null
                       git ls-files --others --exclude-standard -z 2>/dev/null
                     } | shasum -a 256 2>/dev/null | cut -d' ' -f1 )
        fi
        echo "<signal:var key=REVIEWED_HEAD>$head</signal:var>"
        echo "<signal:var key=REVIEWED_STATE>$([ -n "$dirty" ] && echo dirty || echo clean)</signal:var>"
        echo "<signal:var key=REVIEWED_DIGEST>$content</signal:var>"
        echo "<signal:var key=REVIEWED_DIGEST_SCOPE>$scope</signal:var>"
        [ "$scope" = names-only ] && echo "<signal:update>$untracked_n untracked files — the digest covers names, not contents</signal:update>"

        # THE SUBJECT ITSELF CAN BE WRONG, and an empty-workspace check does not see
        # it. Live: virtiofs served a STALE snapshot under /private/tmp — the tree was
        # not empty, it held yesterday's code, and four panelists returned four
        # confident INSUFFICIENTs about a subject that no longer existed. An empty
        # tree at least produces honest INSUFFICIENT; a tree holding the wrong code
        # produces a full-looking round with a machine-readable verdict and nothing
        # anywhere saying the subject was swapped.
        # The caller knows the HEAD it MEANS to review. We know the HEAD we SEE. When
        # both exist and disagree, that is the swap, and it costs one comparison
        # instead of twenty minutes and a full panel. Nothing is required: a caller
        # who passes no HEAD gets today's behaviour, because there is nothing to
        # check against and inventing an expectation would be worse than no check.
        if [ -n "${HEAD:-}" ] && [ "$head" != "no-commits" ] \
           && [ "${HEAD#"${head}"}" = "$HEAD" ] && [ "${head#"${HEAD}"}" = "$head" ]; then
          echo "spar: the tree under review is NOT the one you named." >&2
          echo "spar:   you passed HEAD: $HEAD" >&2
          echo "spar:   the tree is at:  $head" >&2
          echo "spar: a stale mount or the wrong worktree — check before spending a panel." >&2
          echo "<signal:failed>subject mismatch: passed HEAD $HEAD, tree at $head</signal:failed>"
          exit 1
        fi
      elif [ -e .git ]; then
        # A .git that exists while git refuses is NOT "no repository". It is the
        # signature of a LANE WORKTREE mounted without its gitdir: a worktree's
        # .git is a FILE pointing at a directory outside the mount, so every git
        # command fails with "not a git repository" while the tree plainly is one.
        # Reported downstream, reproduced here. Saying "not a git repository"
        # would be a lie in the useful direction — the reader needs to know the
        # MOUNT is wrong, not that the code is unversioned. And the opposite fix,
        # asserting that git always works, is the same error with the sign flipped:
        # both mounts are real, and only a probe can tell them apart.
        echo "<signal:var key=REVIEWED_STATE>git-unavailable</signal:var>"
        echo "spar: .git is present but git cannot read it — a worktree mounted" >&2
        echo "spar: without its gitdir? The panel will review these bytes anyway," >&2
        echo "spar: but nothing can bind them to a revision." >&2
      else
        # NO GIT, BUT STILL A SUBJECT. A handout tree — copies of live sources
        # assembled outside any repository — is a legitimate thing to review for a
        # planning question, where the subject is an intention rather than a commit.
        # But without a digest the verdict cannot say WHAT it read, and nobody, the
        # author included, can reconstruct it afterwards. So hash the bytes directly:
        # every file's path and content, sorted, excluding our own bookkeeping. Same
        # property as the git form — reproducible on one tree, different when any
        # byte moves — just without a commit to anchor it to.
        # COUNT FIRST, and only then hash. shasum always prints something: fed
        # nothing at all it answers e3b0c442... — the hash of the empty string — so a
        # find that failed, a tree that is genuinely empty, and a pipe that broke in
        # the middle all produce the SAME confident 64 hex characters. A digest that
        # cannot tell "nothing to read" from "could not read" is worse than none: it
        # reads as a fact. If there are no files, say nothing and let the round's own
        # empty-workspace check speak.
        finder() { find . -type f \
                     -not -path './.git/*' -not -path './.medulla/*' -not -path './box/*' \
                     "$@" 2>/dev/null; }
        files=$(finder | wc -l | tr -d ' ')
        echo "<signal:var key=REVIEWED_STATE>not-a-git-repository</signal:var>"
        # The same trap, and worse here: with no repository there are no ignore rules
        # at all, so a handout tree carrying node_modules would be read file by file.
        if [ "${files:-0}" -eq 0 ]; then
          :                                   # nothing to read, so say nothing
        elif [ "$files" -le 2000 ]; then
          content=$( finder -print0 \
                     | LC_ALL=C sort -z \
                     | xargs -0 -I{} sh -c 'printf "file:%s\n" "{}"; cat "{}" 2>/dev/null' \
                     | shasum -a 256 2>/dev/null | cut -d' ' -f1 )
          echo "<signal:var key=REVIEWED_DIGEST>$content</signal:var>"
          echo "<signal:var key=REVIEWED_DIGEST_SCOPE>full</signal:var>"
        else
          content=$( finder -print0 | LC_ALL=C sort -z \
                     | shasum -a 256 2>/dev/null | cut -d' ' -f1 )
          echo "<signal:var key=REVIEWED_DIGEST>$content</signal:var>"
          echo "<signal:var key=REVIEWED_DIGEST_SCOPE>names-only</signal:var>"
          echo "<signal:update>$files files — the digest covers names, not contents</signal:update>"
        fi
      fi
      echo "<signal:ready>ok</signal:ready>"
    timeout: 30
    on_signal:
      ready: panel
      failed: __exit_fail__

  panel:
    inputs:
      - {slug: glm5,   harness: opencode,    model: zai-coding-plan/glm-5.3, effort: max}
      - {slug: gpt5,   harness: codex,       model: gpt-5.6-sol,             effort: high}
      - {slug: sonnet, harness: claude-code, model: claude-sonnet-5}
      - {slug: gemini, harness: agy,         model: "Gemini 3.1 Pro (High)"}
    max_parallel: all
    # Majority, unchanged: 3 of 4 is still a majority because 2 of 4 is a tie.
    # qwen3.8-max was removed from the roster on 2026-09-09 by the owner, on
    # measurement rather than impression: it timed out on its FIRST attempt in 3
    # runs of 3, at 1800s each, and consumed 100%/94%/100% of the run budget while
    # delivering one review in three. Every other panelist finished in 4-15 minutes.
    # In the sharpest run all four other reviews were on disk thirteen minutes in,
    # and the panel then waited 47 more minutes and ended with NO verdict.
    # Removing a panelist is not an occasion to weaken quorum.
    min_success: 3        # majority of the 4-model roster
    # A dead provider must not cost the panel half an hour of silence. The check is a
    # script, not an inline block: it has to validate a download and its JSON before
    # trusting one field out of it, and the six lines of awk-grade shell it used to be
    # failed open on every one of those steps.
    pre: bash "$MEDULLA_WORKFLOW_DIR/scripts/quota_precheck.sh"
    agent:
      harness: "{{input.harness}}"
      model: "{{input.model}}"
      effort: "{{input.effort:-}}"
      # No idle_timeout here on purpose: the panel lives on the engine's 900s default.
      # It briefly declared 1800, on the belief that a reasoning panelist thinks that
      # long between writes. The belief was never checked against the log. The one line
      # qwen produced in 1819 seconds was `[rtk] rtk binary not found` — an opencode
      # startup notice, not thinking: it was hung on a swallowed 429 that pre was
      # supposed to catch and did not. Raising the threshold only made a hang cost
      # twice as much. The real defect was pre failing open, and it is fixed there.
    prompt: |
      {{file:prompts/spar.md}}

      ## Question

      {{var:QUESTION}}

      FIRST, use your file-write tool to write your FULL response to this exact
      path. This file IS your deliverable — printing a SUMMARY without writing
      the file counts as NO answer, however trivial the task seems:

      ```
      {{var:ROUND_DIR}}/{{input.slug}}.md
      ```

      FINISH that same file with `<!-- spar-delivery-complete -->` as its final
      non-empty line. This marker IS part of the deliverable; missing it counts
      as NO answer and triggers a retry.

      Only AFTER the file exists on disk, print exactly one line and stop:

      SUMMARY: <your one-sentence summary>
    # The truth channel. `test -s` alone passed a 32-byte "NONE / GO" with no reason
    # given — a file, not an answer. Checks the two sections the collector reads and
    # that the verdict says something; a panelist that fails this gets its retry, and
    # the reason travels in the manifest row rather than being guessed at later.
    post: |
      f="$ROUND_DIR/$MEDULLA_INPUT_SLUG.md"
      # A retry writes to the SAME path, so a rejected artifact used to vanish under
      # its replacement. Measured live: one reader saw sonnet.md as 19.0K with two
      # HIGH findings and "NO-GO 1,2,3", re-read it and got 15.8K, no HIGH, "NO-GO
      # 1,2" — same root cause, different finding IDS and severities. Anyone who had
      # judged finding 3 against the code would find it gone, and anyone citing
      # "sonnet HIGH" in a ticket would be citing a severity the file no longer
      # carries. Keep the rejected one: it is evidence of what the panelist said
      # first, and the subdirectory keeps it out of the collector's *.md glob.
      # EVERY attempt leaves a copy, not just a rejected one. Keeping it only on
      # rejection missed the case that matters most: an artifact that PASSES this
      # hook and is then overwritten anyway, because the body died or timed out
      # after writing it and the retry started from scratch. Measured twice —
      # sonnet.md changed finding ids and severities under one filename, and
      # gemini.md flipped GO with 3 LOW into NO-GO with 2 HIGH. The flip is the
      # dangerous one: a reader cannot defend against it by re-judging findings,
      # because a GO carries no findings to re-judge. So the record is kept
      # unconditionally, named by attempt, outside the collector's *.md glob.
      if [ -s "$f" ]; then
        mkdir -p "$ROUND_DIR/superseded" 2>/dev/null || true
        cp "$f" "$ROUND_DIR/superseded/$MEDULLA_INPUT_SLUG.${MEDULLA_ATTEMPT_ID:-attempt}.md" \
          2>/dev/null || true
      fi
      test -s "$f" || { echo "no artifact written" >&2; exit 1; }
      # Any heading level. A panelist wrote `### VERDICT`, the hook rejected a complete
      # artifact for it, and the round reported one fewer delivered than it had.
      grep -qE '^#+ *FINDINGS' "$f" || { echo "no FINDINGS section" >&2; exit 1; }
      grep -qE '^#+ *VERDICT'  "$f" || { echo "no VERDICT section" >&2; exit 1; }
      # skip fences: a panelist that copied the prompt's example verbatim wraps the
      # verdict in ``` and repeats the heading inside it — the first non-empty line
      # was the fence, and a delivered artifact was failed for "no verdict"
      v=$(awk '/^#+ *VERDICT/{f=1; next} /^#/{f=0} f && /^```/{next} f && NF {print; exit}' "$f")
      # `**NO-GO**.` is a verdict; emphasis is the model decorating, not deciding
      v=$(printf '%s' "$v" | tr -d '*_`')
      printf '%s' "$v" | sed 's/^[[:space:]]*//' | grep -qE '^(GO|NO-GO|INSUFFICIENT)' \
        || { echo "VERDICT is not one of GO / NO-GO / INSUFFICIENT" >&2; exit 1; }
      # And it must say WHY. A bare "GO" is a file, not an answer: it cannot be argued
      # with, and a reader cannot tell a considered pass from a panelist that gave up.
      # Anything after the word counts — including bare citations for a NO-GO — so this
      # rejects only the truly empty verdict.
      printf '%s' "$v" | sed -E 's/^(NO-GO|INSUFFICIENT|GO)//' | grep -q '[^ [:punct:]]' \
        || { echo "VERDICT gives no reason (format: <WORD> — one line: why)" >&2; exit 1; }
      last=$(awk 'NF {line=$0} END {print line}' "$f")
      [ "$last" = '<!-- spar-delivery-complete -->' ] \
        || { echo "delivery marker missing: last non-empty line must be <!-- spar-delivery-complete -->" >&2; exit 1; }
    post_confirms_delivery: true
    max_attempts: 2                       # a panelist that skips the file-write retries once
    timeout: 1800
    on_signal:
      __done__: synthesize
      __failed__: __exit_fail__

  synthesize:
    shell: |
      # jq for the manifest, python for the panelist files. The parsing used to be awk
      # in this block: six defects in one day, each a parser bug in a language with no
      # parser. collect_verdict.py writes both channels from one pass.
      rows=$(jq -s 'group_by(.key) | map(.[-1])' "$MEDULLA_MANIFEST_PANEL")
      seen=$(echo "$rows" | jq length)
      ok=$(echo "$rows" | jq 'map(select(.ok)) | length')

      # The DENOMINATOR is the configured roster, not the rows that happen to exist.
      # A panelist who never wrote a manifest row at all — a cancelled queue writes
      # none by design, and an engine that dies before the append writes none either —
      # would otherwise drop out of the count and turn "3 of 4 delivered" into a clean
      # "3 of 3", hiding exactly the loss this line exists to report. The engine's own
      # journal knows how many inputs the pool was given; trust it over the leftovers.
      roster=$(jq -rs 'map(select(.kind == "pool" and .node == "panel")) | last
                       | .inputs_total // empty' "$MEDULLA_RUN_DIR/journal.jsonl" 2>/dev/null || true)
      total=$seen
      case "$roster" in
        ''|*[!0-9]*) ;;                       # no journal row yet, or not a number
        *) [ "$roster" -gt "$total" ] && total=$roster ;;
      esac
      out="$MEDULLA_RUN_DIR/verdict.md"

      rc=0
      python3 "$MEDULLA_WORKFLOW_DIR/scripts/collect_verdict.py" \
        "$MEDULLA_RUN_DIR" "$ROUND_DIR" \
        --expected "$total" --delivered "$ok" --min-decided "$MIN_DECIDED" \
        --delivered-slugs "$(echo "$rows" | jq -r '[.[] | select(.ok) | (.input.slug // .key)] | join(",")')" \
        --manifest-json "$(echo "$rows" | jq -c '[.[] | select(.ok | not)
                            | {key, input: {slug: .input.slug}, ok, reason, attempts,
                               message: (.message // "" | .[0:400])}]')" \
        --subject "ticket=$TICKET" --subject "purpose=$PURPOSE" \
        --subject "base=$BASE" --subject "head=$HEAD" \
        --subject "patch_digest=$PATCH_DIGEST" \
        --subject "reviewed_head=$REVIEWED_HEAD" \
        --subject "reviewed_state=$REVIEWED_STATE" \
        --subject "reviewed_digest=$REVIEWED_DIGEST" \
        --subject "reviewed_digest_scope=$REVIEWED_DIGEST_SCOPE" || rc=$?

      [ "$ok" -lt "$total" ] && echo "<signal:update>only $ok/$total panelists delivered</signal:update>"

      if [ "$rc" = "3" ]; then
        echo "<signal:no_quorum>too few panelists could form an opinion — read $out</signal:no_quorum>"
      elif [ "$rc" != "0" ] || [ ! -s "$out" ]; then
        echo "collector failed (rc=$rc); the panelists' own files are in $ROUND_DIR:"
        ls "$ROUND_DIR"/*.md 2>/dev/null || true
        echo "<signal:no_verdict>no $out — read $ROUND_DIR/*.md</signal:no_verdict>"
      else
        grep -m1 '^BLOCKING:' "$out" | sed 's/^/<signal:update>/; s/$/<\/signal:update>/'
        echo "$ok/$total panelists -> $out and verdict.json"
        echo "<signal:ready>$out</signal:ready>"
      fi
    timeout: 30
    on_signal:
      ready: __exit_ok__
      # A panel that answered but could not be collected is NOT a failed panel: the
      # artifacts are there and worth reading. It exits ok with the reason on record.
      no_verdict: __exit_ok__
      # A panel that could not SEE is a failed round: the file exists, the answer does
      # not, and a caller must not read it as one.
      no_quorum: __exit_fail__
