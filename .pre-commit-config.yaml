# Pre-commit gate. Activate once per clone:  pre-commit install
# (install the framework first:  pipx install pre-commit)
#
# ruff lints + fixes what it safely can. A commit that triggers a fix "fails"
# once, writes the fix — re-stage and commit again.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        name: ruff (lint + auto-fix)
        args: [--fix, --config, ruff.toml]
        files: ^cli-agent/.*\.py$
