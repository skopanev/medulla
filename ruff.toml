# ruff — the linter for the medulla package ("eslint for Python", faster).
# Run:  ruff check cli-agent/          (add --fix to apply the safe fixes)
#       ruff check cli-agent/ --watch  (while iterating)

target-version = "py310"
line-length = 120
extend-exclude = ["venv", ".opencode", "**/__pycache__"]

[lint]
# Facts, not taste. pyflakes (F) is the real-bug core — unused/undefined names;
# I sorts imports; UP modernizes; E4/E9 guard import placement + syntax. The
# statement-style family (E7 — deliberate semicolons and one-letter names here)
# and judgement-heavy S/BLE/DTZ/B904 are left out on purpose: this codebase makes
# those choices deliberately. Widen the select in a dedicated pass if you want.
select = ["E4", "E9", "F", "I", "UP"]
ignore = [
    "E501",   # line length: the formatter's job, not a hard fail
    "E402",   # imports deliberately placed after module constants (harness.py)
]

[lint.per-file-ignores]
# tests lean on fixtures; unused/redefined names there are noise, not bugs
"cli-agent/tests/**" = ["F401", "F811"]
