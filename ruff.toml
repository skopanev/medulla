# ruff — the "eslint for Python". Lint + import hygiene for the medulla package.
# Run: ruff check cli-agent/    (add --fix to auto-apply the safe fixes)
#
# The file-length budget (250 LOC of code, blanks + comments excluded) is NOT a
# ruff rule — ruff has no per-file line cap — it lives in scripts/check_file_loc.py
# and is wired through pre-commit alongside this config.

target-version = "py310"
line-length = 120           # a ceiling, not the 250 file-LOC budget — different axis
extend-exclude = ["venv", ".opencode", "**/__pycache__"]

[lint]
# Start honest and enforceable: pyflakes (real bugs — unused/undefined names),
# a slice of pycodestyle, import sorting, and pyupgrade. The judgement-heavy
# families (bandit S, blind-except BLE, datetimez DTZ) are left OUT on purpose so
# the gate flags facts, not taste — widen the select in a dedicated cleanup pass.
select = ["E4", "E9", "F", "I", "UP"]
ignore = [
    "E501",   # line length is handled by the formatter, not a hard fail
    "E402",   # imports deliberately placed after module constants (harness.py) — author's call
]

[lint.per-file-ignores]
# tests lean on fixtures and star-ish imports; don't nag them about unused names
"cli-agent/tests/**" = ["F401", "F811"]
